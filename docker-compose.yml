version: '3.8'

services:
  xmltv-enricher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xmltv-enricher
    restart: unless-stopped
    ports:
      - "3000:3000"
    
    # Não definir variáveis de ambiente aqui para permitir que o .env seja usado
    # As configurações devem ser feitas via dashboard ou editando o .env diretamente
    environment:
      - NODE_ENV=production
      - TZ=America/Sao_Paulo
    
    volumes:
      # IMPORTANTE: Montar o .env para que as configurações persistam
      - ./.env:/app/.env
      
      # Persistir output XML
      - ./output:/app/output
      
      # Persistir backups
      - ./backups:/app/backups
      
      # Persistir cache SQLite e arquivo de auditoria
      - ./data:/app/data
      
      # Persistir logs (mapeado para /app/logs dentro do container)
      - ./logs:/app/logs
      
      # Persistir dicionário de limpeza
      - ./cleaner_dictionary.txt:/app/cleaner_dictionary.txt
      
      # Se usar PlexDB, montar o banco (descomente e ajuste o caminho)
      # - /path/to/plex/database:/plexdb:ro
    
    networks:
      - xmltv-network
    
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  xmltv-network:
    driver: bridge
