version: '3.8'

services:
  xmltv-enricher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xmltv-enricher
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Tvheadend
      - TVHEADEND_URL=${TVHEADEND_URL:-http://localhost:9981}
      - TVHEADEND_USERNAME=${TVHEADEND_USERNAME}
      - TVHEADEND_PASSWORD=${TVHEADEND_PASSWORD}
      
      # APIs
      - TVDB_API_KEY=${TVDB_API_KEY}
      - TVDB_PIN=${TVDB_PIN}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - OMDB_API_KEY=${OMDB_API_KEY}
      - PLEX_URL=${PLEX_URL}
      - PLEX_TOKEN=${PLEX_TOKEN}
      - PLEX_DB_ENABLED=${PLEX_DB_ENABLED:-false}
      - PLEX_DB_PATH=${PLEX_DB_PATH}
      
      # Prioridade de APIs
      - API_PRIORITY_ORDER=${API_PRIORITY_ORDER:-plex,tvdb,tmdb,omdb}
      
      # Processamento
      - SCHEDULE_INTERVAL_HOURS=${SCHEDULE_INTERVAL_HOURS:-12}
      - CONCURRENCY_LIMIT=${CONCURRENCY_LIMIT:-3}
      - RUN_ON_START=${RUN_ON_START:-true}
      
      # Cache
      - CACHE_ENABLED=${CACHE_ENABLED:-true}
      - CACHE_TTL_HOURS=${CACHE_TTL_HOURS:-24}
      
      # Matching
      - MATCHING_ALGORITHM=${MATCHING_ALGORITHM:-jaro_winkler}
      - CONFIDENCE_THRESHOLD=${CONFIDENCE_THRESHOLD:-85}
      
      # Output
      - OUTPUT_FILE_PATH=/app/output/xmltv.xml
      - PLACEHOLDER_IMAGE_URL=${PLACEHOLDER_IMAGE_URL}
      
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FILE=/var/log/xmltv-enricher.log
      - DEBUG_URLS=${DEBUG_URLS:-false}
      
      # API Server
      - API_PORT=3000
      
      # Backup
      - BACKUP_ENABLED=${BACKUP_ENABLED:-true}
      - BACKUP_DIR=/app/backups
      - MAX_BACKUPS=${MAX_BACKUPS:-5}
      
      # Notificações
      - WEBHOOK_URL=${WEBHOOK_URL}
      - WEBHOOK_TYPE=${WEBHOOK_TYPE:-generic}
    
    volumes:
      # Persistir output XML
      - ./output:/app/output
      
      # Persistir backups
      - ./backups:/app/backups
      
      # Persistir cache SQLite
      - ./data:/app
      
      # Persistir logs
      - ./logs:/var/log
      
      # Se usar PlexDB, montar o banco
      # - /path/to/plex/database:/plexdb:ro
    
    networks:
      - xmltv-network
    
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  xmltv-network:
    driver: bridge

volumes:
  xmltv-data:
    driver: local
